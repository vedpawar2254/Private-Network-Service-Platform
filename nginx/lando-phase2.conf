# ---- Edge (Mac 2) — Phase 2 ----
# Changes vs Phase 1 (nginx/lando.conf):
#   - X-Edge header      -> shows WHICH edge served the request (needed for Extension E cutover)
#   - X-Upstream header  -> shows which backend IP:port nginx used (Extension D failover proof)
#   - error_log at "warn" -> logs "upstream ... failed / marked down" lines for evidence
#   - proxy_next_upstream_tries 2 -> one retry on the other backend, then give up

log_format edge '$remote_addr [$time_local] "$request" $status '
                'backend=$upstream_addr ($upstream_status) ${request_time}s '
                '$ssl_protocol host=$host';

# Passive health check (open-source nginx has no active health_check):
#   max_fails=1 fail_timeout=10s -> after 1 failed connect, the server is skipped for 10s,
#   then nginx tries it again with a real request. If it answers, it is back in rotation.
upstream team_backends {                                     # round-robin
    server 10.7.21.122:3001 max_fails=1 fail_timeout=10s;     # Backend A (Mac 3)
    server 10.7.15.167:3002 max_fails=1 fail_timeout=10s;     # Backend B (Mac 4)
}

server {
    listen 80;
    server_name app.lando.test api.lando.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.lando.test api.lando.test;
    access_log /opt/homebrew/var/log/nginx/lando-access.log edge;
    error_log  /opt/homebrew/var/log/nginx/lando-error.log warn;

    ssl_certificate     /opt/homebrew/etc/nginx/certs/server.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Edge     "mac2-primary" always;
    add_header X-Upstream $upstream_addr always;

    location / {
        proxy_pass http://team_backends;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
