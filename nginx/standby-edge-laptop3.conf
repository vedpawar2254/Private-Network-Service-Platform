# LANdo Standby Edge Configuration (for Laptop 3: 10.7.6.183)
# CN Project Phase 2 - Extension E (Controlled Edge Migration)
#
# When migrating traffic from Mac 2 to Mac 3:
# 1. Copy TLS certs from Mac 2 or generate on Mac 3
# 2. Install this config to $(brew --prefix)/etc/nginx/servers/standby.conf
# 3. Start nginx on Mac 3: sudo nginx
# 4. Update DNS record on Mac 1 to point to Laptop 3 (10.7.6.183)

upstream standby_backends {
    server 127.0.0.1:3001 max_fails=1 fail_timeout=10s; # Local Backend A
    server 10.7.7.247:3002 max_fails=1 fail_timeout=10s; # Remote Backend B (Laptop 4)
}

server {
    listen 80;
    server_name app.lando.test api.lando.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.lando.test api.lando.test;

    ssl_certificate     /opt/homebrew/etc/nginx/certs/server.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://standby_backends;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}

