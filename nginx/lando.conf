# ---- Edge (Mac 2) ----
# Access log that also shows WHICH backend served each request
log_format edge '$remote_addr [$time_local] "$request" $status '
                'backend=$upstream_addr ($upstream_status) ${request_time}s '
                '$ssl_protocol host=$host';

upstream team_backends {                                     # default strategy = round-robin
    server 10.7.6.183:3001 max_fails=1 fail_timeout=10s;     # Backend A (Mac 3)
    server 10.7.7.247:3002 max_fails=1 fail_timeout=10s;     # Backend B (Mac 4)
}

# Port 80: redirect everything to HTTPS
server {
    listen 80;
    server_name app.lando.test api.lando.test;
    return 301 https://$host$request_uri;
}

# Port 443: TLS terminates here, then plain HTTP to the backends
server {
    listen 443 ssl;
    http2 on;
    server_name app.lando.test api.lando.test;
    access_log /opt/homebrew/var/log/nginx/lando-access.log edge;

    ssl_certificate     /opt/homebrew/etc/nginx/certs/server.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;   # keep 1.2: its handshake is visible in Wireshark

    location / {
        proxy_pass http://team_backends;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If a backend is down, fail fast and retry on the other one
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
