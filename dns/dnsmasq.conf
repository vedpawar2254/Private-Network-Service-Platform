# ---- Team DNS (Mac 1) — Phase 2 ----
no-resolv
server=8.8.8.8
server=1.1.1.1

# Our zone
local=/LANdo.test/

# A records -> both names point to the edge (Mac 2)
host-record=app.LANdo.test,10.7.21.122
host-record=api.LANdo.test,10.7.21.122

# Phase 2: Short TTL = 30 seconds for visible TTL demo
local-ttl=30

# Log every query
log-queries
log-facility=/tmp/dnsmasq.log
