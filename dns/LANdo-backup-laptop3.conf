# LANdo Backup DNS Configuration (for Laptop 3: 10.7.6.183)
# CN Project Phase 2 - Extension A (Backup DNS Resolver)
#
# Usage on Laptop 3 (if chosen as secondary DNS):
# 1. Install dnsmasq: brew install dnsmasq
# 2. Copy to $(brew --prefix)/etc/dnsmasq.conf
# 3. sudo brew services restart dnsmasq

no-resolv
server=8.8.8.8
server=1.1.1.1

local=/lando.test/
# Points to Mac 2 (Edge Nginx)
host-record=app.lando.test,10.7.26.218
host-record=api.lando.test,10.7.26.218

local-ttl=60
log-queries

